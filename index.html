<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DB Inc 교육 방명록 · 시작 화면</title>
<style>*{box-sizing:border-box}body{font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#2B2926;background:#FFFCF8;line-height:1.65;margin:0}main{max-width:720px;margin:60px auto;padding:0 28px}small{font-weight:700;letter-spacing:.14em;color:#FF6F0F}h1{font-size:clamp(36px,6vw,56px);letter-spacing:-.05em;line-height:1.2}p{color:#7A7168}label{display:block;font-weight:700;margin-top:24px}input,textarea{width:100%;font:inherit;border:1px solid #E5D9CD;border-radius:18px;padding:14px;margin-top:8px}button{width:100%;margin-top:24px;padding:16px;background:#FFF1E6;color:#A94A08;border:0;border-radius:18px;font:inherit;font-weight:700}.note{font-size:13px;border-top:1px solid #F0E7DF;margin-top:32px;padding-top:20px}</style></head>
<body><main><small>DB INC · FIRST HTML</small><h1>DB Inc 교육 방명록</h1><p>지금은 HTML 화면만 있는 전단지입니다. 서버와 DB를 붙이면 다른 사람이 남긴 글도 저장됩니다.</p>
<label for="name">이름</label><input id="name" placeholder="실습용 별칭">
<label for="message">내용</label><textarea id="message" rows="4" placeholder="오늘 만들어보고 싶은 것은?"></textarea>
<button type="button" disabled>저장 기능은 서버를 붙인 뒤에 연결합니다</button><p class="note">현재는 HTML 화면만 있습니다. 입력한 내용은 저장되지 않습니다.</p></main></body></html>
